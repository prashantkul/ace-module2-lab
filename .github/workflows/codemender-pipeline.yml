name: CodeMender CI/CD Guardrail

# ---------------------------------------------------------------------------
# Module 2 Lab — autonomous security scanning + remediation with Google
# CodeMender (the `cm` CLI), wired as a CI/CD deployment guardrail.
#
# Flow (one push to main demonstrates all four grading criteria):
#   checkout -> install cm -> cm init -> narrow scope (park unlisted files)
#     -> cm find (scan, UPLOADS source) -> cm report -f json (artifact)
#     -> triage -> cm fix (auto-patch) -> restore parked files
#     -> open remediation PR -> SECURITY GATE (fail red on HIGH/CRITICAL)
#
# Auth (KEYLESS — Workload Identity Federation; see lab/README.md Step 2):
#   * No service-account key exists anywhere in this design. The runner mints
#     a GitHub OIDC token (`id-token: write` below) and the auth step
#     exchanges it for short-lived credentials of the CI service account,
#     via the pool/provider created by lab/setup-wif.sh. Three repo
#     VARIABLES (plain config, not secrets) wire it up:
#       GCP_WIF_PROVIDER  — projects/<n>/locations/global/workloadIdentityPools/…/providers/…
#       GCP_SA_EMAIL      — the CI service account to impersonate
#       GCP_QUOTA_PROJECT — project that absorbs Vertex AI quota/billing
#     plus ONE repo SECRET:
#       WIF_AUDIENCE      — class-shared audience string the provider requires
#                           in the OIDC token (`aud` claim). Keeps strangers
#                           who merely name a repo ace-module2-lab from riding
#                           the fixed-name admission rule. From the lab page.
#     The SA needs BOTH roles/aiplatform.user AND
#     roles/serviceusage.serviceUsageConsumer — aiplatform.user does NOT
#     include serviceusage.services.use, and without the second role ADC
#     fails with "Grant the caller the roles/serviceusage.serviceUsageConsumer
#     role". `cm` (v0.2.0) reads ADC + GOOGLE_CLOUD_PROJECT, both exported
#     by the auth step. Proven against the real cm backend by
#     .github/workflows/wif-auth-test.yml.
#   * GITHUB_TOKEN    — built-in; used to open the remediation pull request.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "main" ]
    paths-ignore:          # doc-only changes shouldn't trigger a ~20-min scan
      - '**.md'
      - 'lab/**'
      - '.gitignore'
  workflow_dispatch:
  # Note: no `pull_request:` trigger — it produced branch-less red runs on the
  # bot-authored remediation PR and GitHub "action_required" approval prompts.
  # The fix/PR steps keep `github.event_name != 'pull_request'` guards, so a
  # pull_request trigger can be safely re-added here to gate PRs if desired.

permissions:
  contents: write          # create the remediation branch / commit the patch
  pull-requests: write     # open the autonomous remediation PR
  id-token: write          # mint the GitHub OIDC token WIF exchanges for GCP creds

env:
  # Scan root (a flat directory — `cm fix` relies on that, see the fix step).
  # cm also uses this as its read sandbox, so "SANDBOX VIOLATION ... blocked"
  # lines in the scan log are EXPECTED and benign — the agent tried to follow
  # an import outside routes/ (e.g. ../lib) and was denied; the scan continues.
  # Keeping the sandbox tight = shorter, cheaper scans. To widen context later:
  # `cm find` accepts repeated --allowed-roots <dir> flags (never pass the repo
  # root — the WIF credential file gha-creds-*.json lands there and anything
  # in-sandbox is uploadable by the agent).
  SCAN_PATH: routes
  # Which files under SCAN_PATH are actually scanned (space-separated
  # basenames). QUOTA CONTROL: every uploaded file costs server-side agent
  # rounds against the class-shared Vertex AI quota, and routes/ holds 61
  # files (~300 KB) while the findings the lab needs live in a handful of
  # them. cm has no per-file include/exclude (only extension filters and the
  # directory you point it at), so the "Narrow scan scope" step temporarily
  # moves every OTHER file out of SCAN_PATH for the scan + fix steps and the
  # "Restore unscanned files" step moves them back. Add/remove basenames here
  # to change the scope; each one must exist in SCAN_PATH. The default five
  # (~22 KB) carry the canonical findings: SQL injection (login.ts,
  # search.ts), XXE / Zip-Slip / YAML-DoS (fileUpload.ts), server-side
  # template injection + eval (userProfile.ts), path traversal (dataErasure.ts).
  SCAN_FILES: "login.ts search.ts fileUpload.ts userProfile.ts dataErasure.ts"
  # The `cm` binary ships vendored in the repo, so template copies work with
  # zero extra setup (GitHub does NOT copy Releases on fork/template — a
  # release-download step here broke every student copy).
  CM_BUNDLED: lab/bin/cm-linux
  # How many of the top-ranked HIGH/CRITICAL findings to auto-remediate in one
  # run (all land in a single PR). Set to 1 for a minimal single-fix lab.
  CM_FIX_LIMIT: "3"

jobs:
  codemender-security:
    name: Scan, Identify, and Patch
    runs-on: ubuntu-latest
    timeout-minutes: 60          # multiple cm fix calls are server round-trips

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so cm can evaluate code context

      # Keyless-auth preflight: fail fast, with one actionable message, if any
      # of the three WIF repo variables is missing — instead of a cryptic
      # token-exchange error at the auth step.
      - name: Check WIF configuration
        run: |
          set -uo pipefail
          MISSING=""
          [ -n "${{ vars.GCP_WIF_PROVIDER }}" ]  || MISSING="$MISSING GCP_WIF_PROVIDER"
          [ -n "${{ vars.GCP_SA_EMAIL }}" ]      || MISSING="$MISSING GCP_SA_EMAIL"
          [ -n "${{ vars.GCP_QUOTA_PROJECT }}" ] || MISSING="$MISSING GCP_QUOTA_PROJECT"
          [ -n "${{ secrets.WIF_AUDIENCE }}" ]   || MISSING="$MISSING WIF_AUDIENCE(Secrets-tab)"
          if [ -n "$MISSING" ]; then
            echo "::error title=Missing WIF configuration::Not set:$MISSING. cm authenticates keylessly via Workload Identity Federation — add the three VARIABLES and the WIF_AUDIENCE SECRET per lab/README.md Step 2 (values come from your instructor / lab page)."
            exit 1
          fi
          echo "WIF configuration present:"
          echo "  provider: ${{ vars.GCP_WIF_PROVIDER }}"
          echo "  SA:       ${{ vars.GCP_SA_EMAIL }}"
          echo "  project:  ${{ vars.GCP_QUOTA_PROJECT }}"
          echo "  audience: (secret set)"

      # Exchanges the runner's OIDC token for short-lived SA credentials,
      # writes the ADC credential file, and exports
      # GOOGLE_APPLICATION_CREDENTIALS + GOOGLE_CLOUD_PROJECT for all later
      # steps — exactly what `cm` reads. No key is involved at any point.
      - name: Authenticate to Google Cloud (WIF / ADC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          project_id: ${{ vars.GCP_QUOTA_PROJECT }}
          # Class-shared audience: the provider only accepts OIDC tokens
          # minted with this `aud` value (second factor next to the repo name).
          audience: ${{ secrets.WIF_AUDIENCE }}

      - name: Install CodeMender CLI (cm)
        run: |
          set -euo pipefail
          if [ ! -f "$CM_BUNDLED" ]; then
            echo "::error title=cm binary missing::$CM_BUNDLED not found in this repo. Copy the template repo fully (it ships the binary) — see lab/INSTRUCTOR.md."
            exit 1
          fi
          # Copy out of the checkout so later steps get a stable `cm` on PATH
          # and the working tree stays clean for the remediation diff.
          mkdir -p "$RUNNER_TEMP/cmbin"
          install -m 0755 "$CM_BUNDLED" "$RUNNER_TEMP/cmbin/cm"
          echo "$RUNNER_TEMP/cmbin" >> "$GITHUB_PATH"     # cm on PATH for later steps
          "$RUNNER_TEMP/cmbin/cm" --version || true

      - name: Initialize CodeMender Workspace (cm init)
        run: |
          set -uo pipefail
          # Creates ~/.codemender/ (default config, state DB, patch storage).
          cm init || true
          # Non-fatal environment self-check — surfaces auth/config problems
          # here instead of minutes into the scan.
          cm init --verify || echo "::warning::cm init --verify reported problems (see log above)."
          ls -la "$HOME/.codemender/" 2>/dev/null || echo "::warning::~/.codemender was not created by cm init."

      # Park every file in SCAN_PATH that is NOT listed in SCAN_FILES so that
      # `cm find` only uploads (and spends quota on) the listed files. The
      # parked files come back in "Restore unscanned files" below, which runs
      # even when the scan or fix fails; and the PR step only ever adds the
      # listed files, so a parked file can never show up as a deletion in the
      # remediation PR. Everything else in the pipeline (fix path resolution,
      # diff extraction, sandbox) is unchanged — cm still scans SCAN_PATH.
      - name: Narrow scan scope (park unscanned files)
        id: scope
        run: |
          set -euo pipefail
          PARK="$RUNNER_TEMP/parked-$(basename "$SCAN_PATH")"
          mkdir -p "$PARK"
          # Validate the list BEFORE moving anything, so a typo fails cleanly.
          ADD_PATHS=""
          for F in $SCAN_FILES; do
            if [ ! -f "$SCAN_PATH/$F" ]; then
              echo "::error title=SCAN_FILES entry missing::$SCAN_PATH/$F does not exist — fix the SCAN_FILES list in the workflow env block."
              exit 1
            fi
            ADD_PATHS="$ADD_PATHS$SCAN_PATH/$F"$'\n'
          done
          # Record the park dir first so the restore step runs even if a move fails.
          echo "park_dir=$PARK" >> "$GITHUB_OUTPUT"
          { echo "add_paths<<__CM_EOF__"; printf '%s' "$ADD_PATHS"; echo "__CM_EOF__"; } >> "$GITHUB_OUTPUT"
          KEPT=0; PARKED=0
          for P in "$SCAN_PATH"/*; do
            F="$(basename "$P")"
            case " $SCAN_FILES " in
              *" $F "*) KEPT=$((KEPT + 1)) ;;
              *)        mv "$P" "$PARK/"; PARKED=$((PARKED + 1)) ;;
            esac
          done
          echo "Scan scope: $KEPT file(s) kept in $SCAN_PATH/, $PARKED parked in $PARK (restored after the fix step)."
          ls -la "$SCAN_PATH"

      - name: CodeMender Scan (cm find)
        id: scan
        run: |
          set -uo pipefail
          echo "Scanning '$SCAN_PATH' — files: $SCAN_FILES (in-scope source is uploaded to Google's CodeMender service)..."
          cm find "$SCAN_PATH" -y 2>&1 | tee "$RUNNER_TEMP/cm-find.cm.log"

      - name: Export Security Report (cm report -f json)
        if: ${{ always() && steps.scan.conclusion != 'skipped' }}
        run: |
          set -uo pipefail
          cm report -f json > "$RUNNER_TEMP/cm-security-report.json" 2> "$RUNNER_TEMP/cm-report.err" || true
          echo "----- report (first 2 KB) -----"
          head -c 2048 "$RUNNER_TEMP/cm-security-report.json" || true
          echo

      - name: Upload Security Report
        if: ${{ always() && steps.scan.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: codemender-report
          path: ${{ runner.temp }}/cm-security-report.json
          if-no-files-found: warn

      - name: Triage Findings
        id: triage
        run: |
          python3 .github/scripts/cm_triage.py "$RUNNER_TEMP/cm-security-report.json"

      - name: Autonomous Remediation (cm fix, top-N)
        id: fix
        # Open a remediation PR on push or manual run; PR events only scan+gate.
        if: ${{ github.event_name != 'pull_request' && steps.triage.outputs.fix_ids != '' }}
        run: |
          set -uo pipefail
          echo "Remediating top finding(s): ${{ steps.triage.outputs.fix_ids }}"
          for FID in ${{ steps.triage.outputs.fix_ids }}; do
            echo "::group::cm fix $FID"
            # Run cm from INSIDE $SCAN_PATH. cm records each finding's path
            # relative to the scan root it was found under — usually a bare
            # basename ("search.ts") — but `cm fix` stats that path against the
            # process CWD. From the repo root that resolves to ./search.ts,
            # which doesn't exist, and cm dies in milliseconds with
            #   Error: acquiring write lock on search.ts: stat search.ts: ...
            # producing no patch and therefore an empty remediation PR branch.
            # cd'ing in makes the relative form resolve; findings that stored an
            # absolute path instead (cm is inconsistent) work either way.
            # --bypass-warning: cm 0.2.0's responsibility warning must be
            # acknowledged interactively once per machine; CI runners are
            # fresh every run, so the session dies before fixing without it.
            ( cd "$SCAN_PATH" && cm fix "$FID" -y --bypass-warning ) 2>&1 \
              | tee "$RUNNER_TEMP/fix-$FID.cm.log" || true
            # Surface a path-resolution failure on its own — otherwise it is
            # indistinguishable from success in the "no clean diff" branch below.
            if grep -q "acquiring write lock" "$RUNNER_TEMP/fix-$FID.cm.log"; then
              echo "::warning title=cm fix could not open the target file::$FID — cm could not resolve its recorded file path from $SCAN_PATH; no patch was produced for this finding."
            fi
            # In a non-interactive CI shell, `cm fix` reliably PRINTS the patch but
            # may not write it (its "Apply these changes? [y/N]" prompt reads EOF).
            # Extract the printed diff and apply it ONLY if it applies cleanly — so
            # this is a no-op when cm already wrote the file itself. cm prints diff
            # paths relative to the scan root (a/search.ts), hence --directory below.
            python3 .github/scripts/extract_cm_diff.py "$RUNNER_TEMP/fix-$FID.cm.log" > "$RUNNER_TEMP/fix-$FID.patch" || true
            if [ -s "$RUNNER_TEMP/fix-$FID.patch" ] \
               && git apply --check -p1 --directory="$SCAN_PATH" "$RUNNER_TEMP/fix-$FID.patch" 2>/dev/null; then
              git apply -p1 --directory="$SCAN_PATH" "$RUNNER_TEMP/fix-$FID.patch"
              echo "Applied extracted patch for $FID."
            else
              echo "No clean diff to apply for $FID (cm applied it directly, or it conflicts) — skipping."
            fi
            echo "::endgroup::"
          done

      # Counterpart of "Narrow scan scope": put the parked files back so the
      # working tree differs from HEAD only by cm's patches. Runs on failure
      # too (the PR step below only adds SCAN_FILES regardless).
      - name: Restore unscanned files
        if: ${{ always() && steps.scope.outputs.park_dir != '' }}
        run: |
          set -euo pipefail
          PARK="${{ steps.scope.outputs.park_dir }}"
          find "$PARK" -mindepth 1 -maxdepth 1 -exec mv -t "$SCAN_PATH/" {} +
          rmdir "$PARK"
          echo "Restored parked files; $SCAN_PATH/ now holds $(ls "$SCAN_PATH" | wc -l) file(s)."
          echo "----- working-tree changes under $SCAN_PATH -----"
          git status --porcelain -- "$SCAN_PATH" || true

      - name: Open Remediation Pull Request
        id: pr
        if: ${{ github.event_name != 'pull_request' && steps.fix.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codemender/auto-remediation
          delete-branch: true
          # Only the scanned files — never the whole directory, so a parked
          # file can't be committed as a deletion if the restore step misbehaved.
          add-paths: |
            ${{ steps.scope.outputs.add_paths }}
          commit-message: |
            fix(security): CodeMender autonomous remediation

            Patches generated by `cm fix` for the top ${{ steps.triage.outputs.fix_count }} HIGH/CRITICAL finding(s).
          title: "🤖 CodeMender: autonomous security remediation (${{ steps.triage.outputs.fix_count }} fix(es))"
          labels: |
            security
            automated
            codemender
          body: |
            ## 🤖 Autonomous remediation by CodeMender

            CodeMender's CI/CD guardrail scanned `${{ env.SCAN_PATH }}`
            (files: `${{ env.SCAN_FILES }}`) and found
            **${{ steps.triage.outputs.high_critical }} HIGH/CRITICAL** finding(s).
            This PR auto-remediates the top **${{ steps.triage.outputs.fix_count }}** via `cm fix`:

            ${{ steps.triage.outputs.fix_summary }}

            ---
            Full machine-readable report: the **`codemender-report`** artifact on
            [run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            > ⚠️ Review before merging. The pipeline run on `main` stays **red** until
            > the HIGH/CRITICAL findings are resolved — that is the deployment gate.

      - name: Security Gate (fail on HIGH/CRITICAL)
        if: always()          # the deploy decision must run even if the PR step had issues
        run: |
          set -uo pipefail
          # Fail CLOSED: no completed scan/triage means no evidence the code is
          # safe — that blocks deployment too. (A gate that passes green when
          # the scanner crashed would wave unscanned code through.)
          if [ "${{ steps.triage.outcome }}" != "success" ]; then
            echo "::error title=Deployment blocked::Security scan did not complete (triage outcome: ${{ steps.triage.outcome }}). Failing closed — no scan, no deploy."
            exit 1
          fi
          COUNT="${{ steps.triage.outputs.high_critical }}"
          COUNT="${COUNT:-0}"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Deployment blocked::CodeMender found $COUNT HIGH/CRITICAL finding(s). Failing the pipeline."
            exit 1
          fi
          echo "No HIGH/CRITICAL findings — security gate passed. ✅"
