name: CodeMender CI/CD Guardrail

# ---------------------------------------------------------------------------
# Module 2 Lab — autonomous security scanning + remediation with Google
# CodeMender (the `cm` CLI), wired as a CI/CD deployment guardrail.
#
# Flow (one push to main demonstrates all four grading criteria):
#   checkout -> install cm -> cm init -> cm find (scan, UPLOADS source)
#     -> cm report -f json (artifact) -> triage -> cm fix (auto-patch)
#     -> open remediation PR -> SECURITY GATE (fail red on HIGH/CRITICAL)
#
# Auth (see lab/README.md):
#   * GCP_SA_KEY      — JSON key of a service account holding BOTH
#     roles/aiplatform.user AND roles/serviceusage.serviceUsageConsumer.
#     The real `cm` authenticates to Google via Application Default
#     Credentials (ADC) and attributes quota to GOOGLE_CLOUD_PROJECT; the
#     auth step below writes the ADC file and exports both env vars.
#     NOTE: aiplatform.user alone is NOT enough — it does not include
#     serviceusage.services.use, so without serviceUsageConsumer ADC fails
#     with "Grant the caller the roles/serviceusage.serviceUsageConsumer
#     role". The lab's v0.1.0 binary still carries an embedded build key,
#     so the pipeline degrades gracefully (with a warning) if the secret
#     is missing.
#   * GITHUB_TOKEN    — built-in; used to download the private `cm` release
#     asset and to open the remediation pull request.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "main" ]
    paths-ignore:          # doc-only changes shouldn't trigger a ~20-min scan
      - '**.md'
      - 'lab/**'
      - '.gitignore'
  workflow_dispatch:
  # Note: no `pull_request:` trigger — it produced branch-less red runs on the
  # bot-authored remediation PR and GitHub "action_required" approval prompts.
  # The fix/PR steps keep `github.event_name != 'pull_request'` guards, so a
  # pull_request trigger can be safely re-added here to gate PRs if desired.

permissions:
  contents: write          # create the remediation branch / commit the patch
  pull-requests: write     # open the autonomous remediation PR

env:
  # Scoped scan target. Kept well under cm's ~10 MB per-scan upload limit and
  # contains the canonical CRITICAL finding (SQL injection in routes/login.ts).
  SCAN_PATH: routes
  # The `cm` binary is published as a private Release asset on THIS repo
  # (see lab/INSTRUCTOR.md) and pulled in with the built-in GITHUB_TOKEN.
  CM_RELEASE_TAG: cm-cli-v0.1.0
  CM_ASSET: cm-linux
  # How many of the top-ranked HIGH/CRITICAL findings to auto-remediate in one
  # run (all land in a single PR). Set to 1 for a minimal single-fix lab.
  CM_FIX_LIMIT: "3"

jobs:
  codemender-security:
    name: Scan, Identify, and Patch
    runs-on: ubuntu-latest
    timeout-minutes: 60          # multiple cm fix calls are server round-trips

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so cm can evaluate code context

      # The `secrets` context can't be tested in a step-level `if:`, so a shell
      # step probes the secret and the auth step keys off its output. Prints
      # only safe metadata (length / credential type / project), never the key.
      - name: Check CI credentials (GCP_SA_KEY)
        id: adc
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -uo pipefail
          if [ -n "${GCP_SA_KEY:-}" ]; then
            echo "GCP_SA_KEY present (${#GCP_SA_KEY} bytes)"
            python3 -c 'import json,os; d=json.loads(os.environ["GCP_SA_KEY"]); print("credential type:", d.get("type"), "| project:", d.get("project_id") or d.get("quota_project_id"))' \
              || echo "::warning::GCP_SA_KEY is set but is not valid JSON — the auth step will likely fail."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=No GCP_SA_KEY secret::cm will fall back to the v0.1.0 binary's embedded build key (shared quota). Provision the secret per lab/README.md Step 2."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Writes the ADC credential file and exports GOOGLE_APPLICATION_CREDENTIALS
      # + GOOGLE_CLOUD_PROJECT (from the key's project_id) for all later steps —
      # exactly what `cm` reads. The SA behind the key needs aiplatform.user AND
      # serviceusage.serviceUsageConsumer (see the header comment).
      - name: Authenticate to Google Cloud (ADC)
        if: ${{ steps.adc.outputs.present == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install CodeMender CLI (cm)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmbin"
          echo "Downloading $CM_ASSET from release $CM_RELEASE_TAG ..."
          gh release download "$CM_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$CM_ASSET" \
            --dir "$RUNNER_TEMP/cmbin"
          mv "$RUNNER_TEMP/cmbin/$CM_ASSET" "$RUNNER_TEMP/cmbin/cm"
          chmod +x "$RUNNER_TEMP/cmbin/cm"
          echo "$RUNNER_TEMP/cmbin" >> "$GITHUB_PATH"     # cm on PATH for later steps
          "$RUNNER_TEMP/cmbin/cm" --version || true

      - name: Initialize CodeMender Workspace (cm init)
        run: |
          set -uo pipefail
          # Mints the local Tink identity keyset at ~/.codemender/identity.key.
          cm init -y 2>/dev/null || cm init 2>/dev/null || true
          if [ -f "$HOME/.codemender/identity.key" ]; then
            echo "CodeMender identity initialized."
          else
            echo "::warning::No identity.key found after cm init; cm may create it on first use."
          fi

      - name: CodeMender Scan (cm find)
        id: scan
        run: |
          set -uo pipefail
          echo "Scanning '$SCAN_PATH' (source is uploaded to codemender.pa.googleapis.com)..."
          cm find "$SCAN_PATH" -y 2>&1 | tee "$RUNNER_TEMP/cm-find.cm.log"

      - name: Export Security Report (cm report -f json)
        if: always()
        run: |
          set -uo pipefail
          cm report -f json > "$RUNNER_TEMP/cm-security-report.json" 2> "$RUNNER_TEMP/cm-report.err" || true
          echo "----- report (first 2 KB) -----"
          head -c 2048 "$RUNNER_TEMP/cm-security-report.json" || true
          echo

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codemender-report
          path: ${{ runner.temp }}/cm-security-report.json
          if-no-files-found: warn

      - name: Triage Findings
        id: triage
        run: |
          python3 .github/scripts/cm_triage.py "$RUNNER_TEMP/cm-security-report.json"

      - name: Autonomous Remediation (cm fix, top-N)
        id: fix
        # Open a remediation PR on push or manual run; PR events only scan+gate.
        if: ${{ github.event_name != 'pull_request' && steps.triage.outputs.fix_ids != '' }}
        run: |
          set -uo pipefail
          echo "Remediating top finding(s): ${{ steps.triage.outputs.fix_ids }}"
          for FID in ${{ steps.triage.outputs.fix_ids }}; do
            echo "::group::cm fix $FID"
            cm fix "$FID" --auto-apply -y 2>&1 | tee "$RUNNER_TEMP/fix-$FID.cm.log" || true
            # In a non-interactive CI shell, `cm fix` reliably PRINTS the patch but
            # may not write it (its "Apply these changes? [y/N]" prompt reads EOF).
            # Extract the printed diff and apply it ONLY if it applies cleanly — so
            # this is a no-op when cm already wrote the file itself.
            python3 .github/scripts/extract_cm_diff.py "$RUNNER_TEMP/fix-$FID.cm.log" > "$RUNNER_TEMP/fix-$FID.patch" || true
            if [ -s "$RUNNER_TEMP/fix-$FID.patch" ] \
               && git apply --check -p1 --directory="$SCAN_PATH" "$RUNNER_TEMP/fix-$FID.patch" 2>/dev/null; then
              git apply -p1 --directory="$SCAN_PATH" "$RUNNER_TEMP/fix-$FID.patch"
              echo "Applied extracted patch for $FID."
            else
              echo "No clean diff to apply for $FID (cm applied it directly, or it conflicts) — skipping."
            fi
            echo "::endgroup::"
          done
          echo "----- working-tree changes under $SCAN_PATH -----"
          git status --porcelain -- "$SCAN_PATH" || true

      - name: Open Remediation Pull Request
        id: pr
        if: ${{ github.event_name != 'pull_request' && steps.fix.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codemender/auto-remediation
          delete-branch: true
          add-paths: |
            ${{ env.SCAN_PATH }}/**
          commit-message: |
            fix(security): CodeMender autonomous remediation

            Patches generated by `cm fix` for the top ${{ steps.triage.outputs.fix_count }} HIGH/CRITICAL finding(s).
          title: "🤖 CodeMender: autonomous security remediation (${{ steps.triage.outputs.fix_count }} fix(es))"
          labels: |
            security
            automated
            codemender
          body: |
            ## 🤖 Autonomous remediation by CodeMender

            CodeMender's CI/CD guardrail scanned `${{ env.SCAN_PATH }}` and found
            **${{ steps.triage.outputs.high_critical }} HIGH/CRITICAL** finding(s).
            This PR auto-remediates the top **${{ steps.triage.outputs.fix_count }}** via `cm fix`:

            ${{ steps.triage.outputs.fix_summary }}

            ---
            Full machine-readable report: the **`codemender-report`** artifact on
            [run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            > ⚠️ Review before merging. The pipeline run on `main` stays **red** until
            > the HIGH/CRITICAL findings are resolved — that is the deployment gate.

      - name: Security Gate (fail on HIGH/CRITICAL)
        if: always()          # the deploy decision must run even if the PR step had issues
        run: |
          set -uo pipefail
          COUNT="${{ steps.triage.outputs.high_critical }}"
          COUNT="${COUNT:-0}"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Deployment blocked::CodeMender found $COUNT HIGH/CRITICAL finding(s). Failing the pipeline."
            exit 1
          fi
          echo "No HIGH/CRITICAL findings — security gate passed. ✅"
